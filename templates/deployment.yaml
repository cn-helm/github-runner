apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-runner.name" . }}
  labels:
    {{- include "github-runner.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "github-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts.yaml") . | sha256sum }}
      labels:
        {{- include "github-runner.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: dependencies
          image: {{ include "github-runner.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/bash, /opt/runner-scripts/download-dependencies.sh]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: packages
              mountPath: /packages
            - name: scripts
              mountPath: /opt/runner-scripts
              readOnly: true
      containers:
        - name: runner
          image: {{ include "github-runner.image" . | quote }}
          command: [/bin/bash, /opt/runner-scripts/start-container.sh]
          {{- if .Values.runner.maintenance }}
          args: [/bin/sleep, infinity]
          {{- else }}
          args: [/bin/bash, /opt/runner-scripts/runner.sh]
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # Root only for offline package installation; script drops to UID 1001.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
          env:
            - name: GITHUB_REPO
              value: {{ required "github.repo is required" .Values.github.repo | quote }}
            - name: GITHUB_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "github.existingSecret is required" .Values.github.existingSecret | quote }}
                  key: {{ .Values.github.tokenKey | quote }}
                  # A registered PVC can restart without a registration token.
                  optional: true
            - name: RUNNER_NAME
              value: {{ default .Release.Name .Values.runner.name | quote }}
            - name: RUNNER_LABELS
              value: {{ .Values.runner.labels | quote }}
            - name: RUNNER_WORK_DIR
              value: {{ .Values.runner.workDir | quote }}
            - name: RUNNER_INIT_VERSION
              value: {{ .Values.runner.initVersion | quote }}
            - name: RUNNER_SHA256
              value: {{ .Values.runner.sha256 | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: persistent
              mountPath: /persistent
            - name: packages
              mountPath: /packages
              readOnly: true
            - name: scripts
              mountPath: /opt/runner-scripts
              readOnly: true
      volumes:
        - name: packages
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ include "github-runner.name" . }}-scripts
        - name: persistent
          persistentVolumeClaim:
            claimName: {{ default (include "github-runner.name" .) .Values.persistence.existingClaim | quote }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
