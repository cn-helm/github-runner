apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-runner.name" . }}
  labels:
    {{- include "github-runner.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "github-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "github-runner.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: GITHUB_REPO
              value: {{ required "github.repo is required" .Values.github.repo | quote }}
            - name: GITHUB_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "github.existingSecret is required" .Values.github.existingSecret | quote }}
                  key: {{ .Values.github.tokenKey | quote }}
                  # A registered PVC can restart without a registration token.
                  optional: true
            - name: RUNNER_NAME
              value: {{ default .Release.Name .Values.runner.name | quote }}
            - name: RUNNER_LABELS
              value: {{ .Values.runner.labels | quote }}
            - name: RUNNER_WORK_DIR
              value: {{ .Values.runner.workDir | quote }}
            - name: RUNNER_INIT_VERSION
              value: {{ .Values.runner.initVersion | quote }}
            - name: RUNNER_SHA256
              value: {{ .Values.runner.sha256 | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: persistent
              mountPath: /persistent
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: {{ default (include "github-runner.name" .) .Values.persistence.existingClaim | quote }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
