image:
  # Build image/Dockerfile and set this to your registry repository.
  repository: github-persistent-runner
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

github:
  repo: cn-ph-spm/spm
  existingSecret: github-runner-registration
  tokenKey: token

runner:
  # Empty means the Helm release name; keep stable across Pod replacements.
  name: ""
  labels: "k8s,ubuntu24"
  workDir: _work
  initVersion: "2.337.0"
  # Linux x64, verified against the official v2.337.0 release.
  sha256: "70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613"

persistence:
  existingClaim: ""
  size: 20Gi
  # null: cluster default; "": explicitly disable dynamic StorageClass selection.
  storageClass: null
  accessModes: [ReadWriteOnce]
  # Retain data and registration credentials on Helm uninstall.
  retain: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

terminationGracePeriodSeconds: 120
# Optional proxy variables, e.g. http_proxy, https_proxy, no_proxy.
# Use extraEnv valueFrom for proxy credentials; do not put secrets in values.
extraEnv: []
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
