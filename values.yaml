image:
  # The dependencies initContainer and runner use the same Ubuntu Noble image.
  repository: public.ecr.aws/ubuntu/ubuntu
  tag: noble
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Requires privileged containers; daemon storage is ephemeral.
dind:
  enabled: true
  image: public.ecr.aws/docker/library/docker:dind
  pullPolicy: IfNotPresent
  startupTimeoutSeconds: 180
  extraEnv: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

github:
  repo: cn-ph-spm/spm
  existingSecret: github-runner-registration
  tokenKey: token

runner:
  # Prepare dependencies, then sleep as UID 1001 without registering/running jobs.
  maintenance: false
  # Empty means the Helm release name; keep stable across Pod replacements.
  name: ""
  labels: "k8s,ubuntu24"
  workDir: _work
  initVersion: "2.337.0"
  # Linux x64, verified against the official v2.337.0 release.
  sha256: "70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613"

persistence:
  existingClaim: ""
  size: 20Gi
  # null: cluster default; "": explicitly disable dynamic StorageClass selection.
  storageClass: gp3-auto
  accessModes: [ReadWriteOnce]
  # Retain data and registration credentials on Helm uninstall.
  retain: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

terminationGracePeriodSeconds: 120
# Passed to both initContainer and runner, e.g. http_proxy, https_proxy, no_proxy.
# Use extraEnv valueFrom for proxy credentials; do not put secrets in values.
extraEnv: []
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
  eks.amazonaws.com/compute-type: auto
tolerations: []
affinity: {}

initResources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
